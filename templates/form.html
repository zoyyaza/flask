<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐻 CAESAR CIPHER - Coklat Pink Cream</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4A2A1A 0%, #8B5E3C 30%, #D4A373 60%, #F8BBD0 85%, #FCE4EC 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Gambar Background - Cookies Pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/cookies.png');
            background-repeat: repeat;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        /* Gambar Background - Bunga */
        .flower-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: url('https://cdn.pixabay.com/photo/2017/01/13/04/56/rose-1976484_640.png');
            background-repeat: repeat;
            background-size: 60px;
            opacity: 0.06;
        }

        /* Efek Bling Bling */
        .sparkle-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255,215,0,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255,215,0,0.08) 0%, transparent 50%);
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* Bintang berkilau */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .stars span {
            position: absolute;
            color: #FFD700;
            font-size: 20px;
            animation: floatStar 8s infinite linear;
            opacity: 0.6;
        }
        
        @keyframes floatStar {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        /* Boneka Beruang pojok kanan */
        .bear-deco {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 85px;
            animation: bounce 2s infinite;
            cursor: pointer;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            z-index: 100;
        }

        .bear-deco:hover {
            animation: bounce 0.5s infinite;
        }

        /* Boneka Beruang pojok kiri */
        .bear-deco-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 70px;
            animation: wave 3s infinite;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            z-index: 100;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(12deg); }
            75% { transform: rotate(-12deg); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header dengan beruang */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .bear-header {
            font-size: 55px;
            display: inline-block;
            animation: bounce 2s infinite;
            margin: 0 10px;
        }

        h1 {
            color: #FFF8EF;
            font-size: 2.2em;
            font-weight: 700;
            letter-spacing: 2px;
            display: inline-block;
            background: rgba(74, 42, 26, 0.75);
            padding: 12px 35px;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Subtitle - DIPERBAIKI jadi center */
        .subtitle {
            text-align: center;
            color: #FFF8EF;
            margin-top: 12px;
            font-size: 1em;
            font-weight: 500;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            background: rgba(74, 42, 26, 0.5);
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding: 8px 25px;
            border-radius: 50px;
            backdrop-filter: blur(3px);
        }

        /* Card utama */
        .card {
            background: rgba(255, 248, 231, 0.95);
            border-radius: 45px;
            padding: 40px;
            margin-top: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), 0 0 20px rgba(255,215,0,0.2);
            border: 2px solid #F8BBD0;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.25), 0 0 30px rgba(255,215,0,0.3);
        }

        .card h2 {
            color: #5C3D2E;
            margin-bottom: 25px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-bottom: 3px solid #F8BBD0;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #5C3D2E;
            font-size: 1em;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #F8BBD0;
            border-radius: 35px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
            font-family: 'Quicksand', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #D4A373;
            box-shadow: 0 0 0 4px rgba(212, 163, 115, 0.15), 0 0 10px rgba(255,215,0,0.3);
        }

        input::placeholder {
            color: #C4A882;
            font-weight: 400;
        }

        button {
            background: linear-gradient(135deg, #5C3D2E 0%, #D4A373 50%, #F8BBD0 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 45px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.4);
            background: linear-gradient(135deg, #6B4A38 0%, #C49A6C 50%, #FCE4EC 100%);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #FFF8EF;
            font-size: 13px;
            padding: 12px;
            background: rgba(74, 42, 26, 0.65);
            border-radius: 50px;
            backdrop-filter: blur(4px);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .footer::before {
            content: "✨";
            margin-right: 8px;
        }

        .footer::after {
            content: "✨";
            margin-left: 8px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }
            h1 {
                font-size: 1.6em;
                padding: 8px 20px;
            }
            .bear-header {
                font-size: 40px;
            }
            .bear-deco {
                font-size: 55px;
            }
            .bear-deco-left {
                font-size: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="flower-pattern"></div>
    <div class="sparkle-effect"></div>
    <div class="stars">
        <span style="left: 10%; animation-duration: 6s;">✨</span>
        <span style="left: 25%; animation-duration: 8s;">⭐</span>
        <span style="left: 40%; animation-duration: 7s;">💎</span>
        <span style="left: 55%; animation-duration: 9s;">✨</span>
        <span style="left: 70%; animation-duration: 5s;">⭐</span>
        <span style="left: 85%; animation-duration: 10s;">💎</span>
        <span style="left: 15%; animation-duration: 7.5s;">✨</span>
        <span style="left: 50%; animation-duration: 6.5s;">⭐</span>
        <span style="left: 75%; animation-duration: 8.5s;">💎</span>
        <span style="left: 95%; animation-duration: 7s;">✨</span>
    </div>
    
    <!-- Boneka Beruang Lucu -->
    <div class="bear-deco" title="🐻 Halo! Aku Bear-Bear 💕">🐻‍❄️</div>
    <div class="bear-deco-left" title="🧸 Aku teman manismu!">🧸</div>

    <div class="container">
        <div class="header">
            <span class="bear-header">🧸</span>
            <h1>CAESAR CIPHER</h1>
            <span class="bear-header">🐻</span>
        </div>
        
        <!-- Subtitle di tengah dengan kata-kata yang sesuai -->
        <div style="text-align: center;">
            <div class="subtitle">
                ✨ ubah nama panjangmu jadi kode rahasia ✨
            </div>
        </div>

        <div class="card">
            <h2>🔐 ENKRIPSI NAMA</h2>
            <form method="POST" action="/">
                <div class="form-group">
                    <label>🐻 NAMA DEPAN</label>
                    <input type="text" name="namaDepan" placeholder="contoh: Raisa" required>
                </div>
                <div class="form-group">
                    <label>🍯 NAMA BELAKANG</label>
                    <input type="text" name="namaBelakang" placeholder="contoh: Andriana" required>
                </div>
                <button type="submit">🔒 ENKRIPSI SEKARANG</button>
            </form>
        </div>
        
        <div class="footer">
            💖 made with love • bear & honey • caesar cipher 💖
        </div>
    </div>
</body>
</html>
