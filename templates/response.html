<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐻 Hasil Enkripsi - Caesar Cipher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', 'Segoe UI', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4A2A1A 0%, #8B5E3C 30%, #D4A373 60%, #F8BBD0 85%, #FCE4EC 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Pattern cookies */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/cookies.png');
            background-repeat: repeat;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        /* Bunga pattern */
        .flower-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: url('https://cdn.pixabay.com/photo/2017/01/13/04/56/rose-1976484_640.png');
            background-repeat: repeat;
            background-size: 60px;
            opacity: 0.06;
        }

        .sparkle-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255,215,0,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255,215,0,0.08) 0%, transparent 50%);
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .stars span {
            position: absolute;
            color: #FFD700;
            font-size: 20px;
            animation: floatStar 8s infinite linear;
            opacity: 0.6;
        }
        
        @keyframes floatStar {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .bear-deco {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 75px;
            animation: bounce 2s infinite;
            z-index: 100;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.2));
        }

        .bear-deco-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 60px;
            animation: wave 3s infinite;
            z-index: 100;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.2));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(12deg); }
            75% { transform: rotate(-12deg); }
        }

        .container {
            max-width: 550px;
            width: 100%;
            z-index: 1;
        }

        .card {
            background: rgba(255, 248, 231, 0.96);
            border-radius: 50px;
            padding: 45px 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), 0 0 20px rgba(255,215,0,0.2);
            border: 2px solid #F8BBD0;
            text-align: center;
        }

        .bear-large {
            font-size: 85px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
            display: inline-block;
        }

        h1 {
            color: #5C3D2E;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-shadow: 1px 1px 2px rgba(255,215,0,0.3);
        }

        .result-box {
            background: linear-gradient(135deg, #FCE4EC 0%, #F8BBD0 50%, #FFF3E0 100%);
            padding: 25px;
            border-radius: 40px;
            margin: 25px 0;
            border: 2px solid #F8BBD0;
            box-shadow: inset 0 0 10px rgba(255,215,0,0.1), 0 0 15px rgba(255,215,0,0.15);
        }

        .result-label {
            color: #5D4037;
            font-size: 0.95em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .result-text {
            background: white;
            padding: 15px 20px;
            border-radius: 35px;
            font-size: 1.2em;
            font-weight: 600;
            color: #5D4037;
            word-break: break-all;
            border: 1px solid #F8BBD0;
            margin: 10px 0;
        }

        .result-text.encrypted {
            background: #FFF0F5;
            color: #C2185B;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5D4037 0%, #A1887F 50%, #F8BBD0 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 45px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-block;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #6D4C41 0%, #8D6E63 50%, #FCE4EC 100%);
        }

        .celebrate {
            font-size: 35px;
            margin: 15px 0;
            animation: sparkle 1.5s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }
            .bear-large {
                font-size: 60px;
            }
            h1 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="flower-pattern"></div>
    <div class="sparkle-effect"></div>
    <div class="stars">
        <span style="left: 10%; animation-duration: 6s;">✨</span>
        <span style="left: 25%; animation-duration: 8s;">⭐</span>
        <span style="left: 40%; animation-duration: 7s;">💎</span>
        <span style="left: 55%; animation-duration: 9s;">✨</span>
        <span style="left: 70%; animation-duration: 5s;">⭐</span>
        <span style="left: 85%; animation-duration: 10s;">💎</span>
        <span style="left: 15%; animation-duration: 7.5s;">✨</span>
        <span style="left: 50%; animation-duration: 6.5s;">⭐</span>
        <span style="left: 75%; animation-duration: 8.5s;">💎</span>
        <span style="left: 95%; animation-duration: 7s;">✨</span>
    </div>
    
    <div class="bear-deco">🐻‍❄️</div>
    <div class="bear-deco-left">🧸</div>

    <div class="container">
        <div class="card">
            <div class="bear-large">
                🔐🐻
            </div>
            <h1>✨ Hasil Enkripsi Namamu ✨</h1>
            
            <div class="result-box">
                <div class="result-label">📝 Nama Panjangmu</div>
                <div class="result-text">{{ nama_asli }}</div>
                
                <div class="result-label" style="margin-top: 20px;">🔐 Kode Rahasianya</div>
                <div class="result-text encrypted">{{ hasil_enkripsi }}</div>
                
                <div class="result-label" style="margin-top: 15px;">⚙️ Shift yang digunakan: 3</div>
            </div>

            <div class="celebrate">
                🎀✨🐻✨🎀
            </div>

            <a href="/" class="btn-primary">🏠 Kembali ke Beranda 🍯</a>
        </div>
    </div>
</body>
</html>
