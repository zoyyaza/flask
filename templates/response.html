<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher</title>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #5D4037, #D4A373, #F8BBD0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,248,231,0.95);
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #F8BBD0;
            border-radius: 30px;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #E91E63, #F06292);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .bear {
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="bear">🐻🔐</div>
        <h1>CAESAR CIPHER</h1>
        <form method="POST">
            <input type="text" name="namaDepan" placeholder="Nama Depan" required>
            <input type="text" name="namaBelakang" placeholder="Nama Belakang" required>
            <button type="submit">ENKRIPSI SEKARANG</button>
        </form>
    </div>
</body>
</html>
